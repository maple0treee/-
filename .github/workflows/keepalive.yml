# 서버가 잠들지 않게 10분마다 /health를 부른다 (서버 쪽 자기 호출이 멈췄을 때 깨우는 예비용)
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 90 -o /dev/null -w "%{http_code}\n" https://orlando.io.kr/health || true
